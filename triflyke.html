<!DOCTYPE html>
<html lang="en">
<head>
    <title>Triflyke</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {font-family: Arial;font-size:12px;background-color: #000;color: #fff;margin: 0px;overflow: hidden;}
		a img {-webkit-tap-highlight-color: transparent;transition: transform 0.15s ease, opacity 0.15s ease;}
		a img:active {transform: scale(0.96);opacity: 0.9;}
        #info {position: absolute;top: 10px;left: 20px;z-index: 100;display:block}
        #info2 {color: #fff;position: absolute;top: 45%;width: 100%;text-align: center;z-index: 100;display:block;}
        #menu {position: absolute; right: 5px;width:85px; top:50%;transform:translate(0,-50%);z-index: 99;cursor: arrow;}
        .btns {cursor: pointer;}
        #info a { color: #fff; font-weight: bold; cursor: pointer; text-decoration:none; }
        .central{position: absolute;width:100%;z-index: 97;top: 50px;animation: hideAnim 0s ease-in 10s; animation-fill-mode:forwards;}
        #escrita {margin: auto;border: 2px solid #3498db;border-radius: 10px;padding: 15px 10px;background-color: rgba(0,0,0,0.5); max-width:350px;}
		.rodapecw{position: absolute;bottom: 20px;left:20px;color:white;font-size:12px;font-family:Arial;margin:auto;width:100%;z-index: 99;}            			
		.centro{text-align:center;margin-right:5px;margin-top:0px;}
		
		.buttonE {padding-top:2px;border:none;border-radius:8px;float:left;font-size:10px;color: #FFFF00;background: rgba(0,0,0,0.5);box-shadow: 0px 0px 12px rgba(220,220,0,0.5);text-align: center;text-decoration: none;cursor: pointer;width: 54px;height:20px;}
		.buttonE:hover {background-color: rgba(0,0,0,1);box-shadow: 0px 0px 12px rgba(220,220,0,0.95);}
		.buttonE:active {color: #000000;background-color: rgba(220,220,0,0.75);}
		
		.fechador {border:none;cursor: pointer;background-color: rgba(0,0,0,0.0);float:right;}            
		.menuBtn {text-align:center;background-color: rgba(150,150,150,0.3);border: none;border-radius: 10px;padding: 5px;width:350px;}
		.tit2{width:100%; text-align:center;margin:5px;}
		#modal_overlay {display: none;position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.6);backdrop-filter: blur(4px);z-index: 999;}
		#modal_orcamento {display: none;position: fixed;top: 50%;left: 50%;transform: translate(-50%, -50%);background: rgba(30,30,30,0.9);border: 1px solid rgba(255,255,255,0.1);border-radius: 12px;padding: 20px;z-index: 1000;width: 280px;box-shadow: 0px 10px 35px rgba(0,0,0,0.8);}
		#modal_sucesso {display: none;position: fixed;top: 50%;left: 50%;transform: translate(-50%, -50%);background: rgba(30,30,30,0.9);border: 1px solid rgba(255,255,255,0.1);border-radius: 12px;padding: 20px;z-index: 1000;width: 280px;box-shadow: 0px 10px 35px rgba(0,0,0,0.8);}
		#client_name {width: 92%;padding: 8px 10px;background: rgba(0,0,0,0.4);border: 1px solid rgba(255,255,255,0.2);color: #fff;border-radius: 6px;font-family: Arial;font-size: 12px;outline: none;}
		#client_name:focus {border-color: rgba(220,220,0,0.5);}
		.modal-btn {width: 100% !important;height: 32px !important;float: none !important;box-sizing: border-box;}
		.ibtn{display:inline-block;cursor:pointer;padding:6px 12px;margin:5px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:Arial,sans-serif;font-size:11px;color:#fff;transition:all 0.2s ease;}
		.ibtn:hover{background:rgba(220,220,0,0.2);border-color:rgba(220,220,0,0.6);color:#ffff00;}
		.ibtn:active{background:rgba(220,220,0,0.5);color:#000;}
        @keyframes hideAnim {to{visibility:hidden;}}
        *, *::after, *::before {-webkit-user-select: none;-webkit-user-drag: none;-webkit-app-region: no-drag;}
        @media (orientation: portrait) {
			.seletor {position:absolute;display:flex;justify-content:center;align-items:center;width:100%;bottom:60px;z-index:100;}
		}
		@media (orientation: landscape) {
		  .seletor {position:absolute;display:flex;justify-content:center;align-items:center;width:200px;bottom:60px;z-index:100;}
		}
    </style>
    <script src="purecookie.js"></script>
    <script src="Jscripts.js"></script>
</head>
<body onload="changeLanguageAM(detectUserLanguage())">
<div id="info"><a href="index.html"><img src="./imagens/voltar.png"></a></div>
<div id="info2">Loading...</div>
<div class="central">
    <p id="escrita" data-i18n="triflyke_info"></p>
</div>
<div id="Container1"></div>

<div class="seletor">
	<div class="menuBtn">
		<p class="tit2" data-i18n="lbl_tri_color"></p>
		<img class="ibtn" id="cor1" src="imagens/cor1.png" alt=""/>
		<img class="ibtn" id="cor2" src="imagens/cor2.png" alt=""/>
		<img class="ibtn" id="cor3" src="imagens/cor3.png" alt=""/>
		<img class="ibtn" id="cor4" src="imagens/cor4.png" alt=""/>
		
		<button id="orc" style="margin-bottom:5px;" data-i18n="btn_orc"></button>
	</div>
</div>

<div id="modal_overlay"></div>
<div id="modal_orcamento">
	<button id="close_modal" class="fechador"><img src="imagens/x.png" alt="Close"></button>
	
	<p class="tit2" style="font-size: 14px; font-weight: bold; margin-bottom: 20px;" data-i18n="title_choose_contact"></p>
	
	<div style="display: flex; flex-direction: column; gap: 8px;">
		<button id="btn_send_direct" class="buttonE modal-btn" data-i18n="btn_via_direct"></button>
		<button id="btn_send_whatsapp" class="buttonE modal-btn" data-i18n="btn_via_whatsapp"></button>
		<button id="btn_send_email" class="buttonE modal-btn" data-i18n="btn_via_email"></button>
	</div>
</div>

<div id="modal_sucesso">
	<button id="close_modal_sucesso" class="fechador"><img src="imagens/x.png" alt="Close"></button>
	<p class="tit2" style="font-size: 14px; font-weight: bold; margin-bottom: 20px;margin-top: 40px;">Sucesso! - success! - éxito!</p>
</div>

<div id="menu">
	<img class="btns" id="Btn1" src="imagens/left.png"/>
	<p class="centro" data-i18n="triflyke_fly"></p>
	<img class="btns" id="Btn2" src="imagens/right.png"/>
	<p class="centro" data-i18n="triflyke_drive"></p>
</div>
	<p class="rodapecw">© 2026 Joao P. • All rights reserved</p>
	<script src="./js/configurator-ui.js"></script>
	<script src="./wp/crd2.js"></script>
</body>
</html>
